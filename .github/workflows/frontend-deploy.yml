name: Frontend Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'ui-design/**'
      - 'infra/aws/frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy-develop
  cancel-in-progress: false

jobs:
  checks:
    name: Install, lint, type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-design
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui-design/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Type-check
        run: pnpm type-check

  deploy:
    name: Build and deploy to AWS
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui-design/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui-design
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ui-design
        run: pnpm build
        env:
          VITE_MOCK_DATA: 'false'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        run: aws s3 sync ui-design/dist s3://${{ vars.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
