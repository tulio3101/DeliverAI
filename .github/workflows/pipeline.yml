name: Multi-stage build, test and deploy to Azure Web App - deliver-AI 

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop 
        types: [opened, synchronize, reopened]
    workflow_dispatch:

jobs:

    build:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
        
        steps:
            - uses: actions/checkout@v4
            
            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'
            
            - name: Build with Maven (skip tests) 
              run: mvn clean package -DskipTests 
           
            - name: Upload artifact 
              uses: actions/upload-artifact@v4
              with:
                name: webapp
                path: target/*.jar

            - name: Upload compiled classes for test cache
              uses: actions/upload-artifact@v4
              with:
                name: compiled-classes
                path: target/classes/
    
    test:
        runs-on: ubuntu-latest
        needs: [build]
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
        
        steps:
          - uses: actions/checkout@v4

          - name: Set up Java 21
            uses: actions/setup-java@v4
            with:
              java-version: '21'
              distribution: 'temurin'
              cache: 'maven'

          - name: Download compiled classes from build job
            uses: actions/download-artifact@v4
            with:
              name: compiled-classes
              path: target/classes/

          - name: Run tests (skips recompilation using cached classes)
            run: mvn test
       
    deploy:
        runs-on: ubuntu-latest
        needs: [build, test]
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: webapp
           
            - name: Azure Login
              uses: azure/login@v2
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}                

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
                package: '*.jar'