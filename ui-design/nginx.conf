user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    image/svg+xml;

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA fallback: try files first, then directories, finally fall back to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets with hash in filename (long expiry)
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html or root HTML files
    location = /index.html {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate, public";
    }

    # Don't cache service worker
    location = /service-worker.js {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate, public";
    }

    # Don't cache manifest and other metadata
    location ~ \.(json|xml|txt)$ {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate, public";
    }

    # Deny access to hidden files and directories
    location ~ /\. {
      deny all;
    }
  }
}
